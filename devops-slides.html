<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps and Code Management — Interactive Slides</title>
<style>
:root{--paper:#F6F3EC;--card:#FFFDF8;--ink:#14202C;--muted:#556170;--line:#CFC6B3;--soft:#ECE6D8;
--teal:#0E7A6F;--teal-s:#D8EFE9;--orange:#C2560B;--orange-s:#FBE6D2;--blue:#1F4FD1;--blue-s:#E0E8FD;--violet:#5B3FB0;--violet-s:#ECE5FA;--green:#18803D;--green-s:#DCF3E2;
--sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Inter,Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d151d;overflow:hidden;font-family:var(--sans);color:var(--ink)}
#viewport{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--paper);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateX(60px);transition:opacity .45s ease,transform .45s ease}
.slide.cur{opacity:1;pointer-events:auto;transform:none}
.slide.past{transform:translateX(-60px)}
.kick{position:absolute;left:100px;top:66px;font-family:var(--mono);font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.ttl{position:absolute;left:100px;top:100px;font-size:60px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.sub-ttl{position:absolute;left:100px;top:180px;font-size:30px;color:var(--muted)}
.dark{background:var(--ink);color:var(--paper)}

/* caption bar */
.capbar{position:absolute;left:100px;right:100px;top:938px;height:96px;display:flex;align-items:center;gap:26px;border-top:2px solid var(--soft)}
.capnum{font-family:var(--mono);font-size:26px;font-weight:700;background:var(--ink);color:#fff;border-radius:12px;padding:8px 16px;white-space:nowrap}
.capnum.idle{background:var(--soft);color:var(--muted)}
.captext{font-size:38px;font-weight:600;line-height:1.2;flex:1}
.captext.hint{font-weight:400;color:var(--muted);font-size:32px}
.captext.pop{animation:capin .4s ease}
@keyframes capin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sdots{display:flex;gap:10px}
.sdots i{width:14px;height:14px;border-radius:50%;background:#d8d0bf}
.sdots i.d{background:var(--teal)}.sdots i.c{background:var(--ink);transform:scale(1.3)}
.capall{display:none}

/* diagram */
svg.wires{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
.arr{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .25s}
.arr.on{opacity:1}
.arr.base{stroke:#C3B9A4;stroke-width:4;stroke-dasharray:10 10;opacity:1}
.arr.live{stroke-dasharray:18 12!important;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.alab{font-family:var(--mono);font-size:24px;font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:8px;opacity:0;transition:opacity .3s}
.alab.on{opacity:1}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 14px;transition:all .4s ease;z-index:2}
.node .t{font-size:30px;font-weight:700;line-height:1.15}
.node .s{font-size:23px;color:var(--muted);margin-top:6px;line-height:1.2;min-height:1px}
.node .ic{font-size:40px;line-height:1;margin-bottom:4px}
.node.on{border-color:var(--blue);box-shadow:0 0 0 8px var(--blue-s);transform:scale(1.05)}
.node.ok{border-color:var(--green);background:#F3FBF5;box-shadow:0 0 0 8px var(--green-s)}
.node.fail{border-color:var(--orange);background:#FFF6EE;box-shadow:0 0 0 8px var(--orange-s);animation:shake .45s}
.node.warn{border-color:var(--orange);box-shadow:0 0 0 8px var(--orange-s)}
.node.dim{opacity:.3}
.node.darkn{background:var(--ink);border-color:var(--ink)}.node.darkn .t{color:#fff}.node.darkn .s{color:#BFD0CC}
.node.dot{border-radius:50%;padding:0;border:0;color:#fff;font-family:var(--mono)}
.node.dot .t{font-size:26px}
.dot.ink{background:var(--ink)}.dot.violet{background:var(--violet)}.dot.amber{background:var(--orange)}.dot.teal{background:var(--teal)}.dot.grey{background:#9aa3ad}
.rv{opacity:0;transform:scale(.6)}
.rv.shown{opacity:1;transform:none}
.node.rv.shown.on{transform:scale(1.05)}
@keyframes shake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}
.tok{position:absolute;transform:translate(-50%,-50%);z-index:6;font-family:var(--mono);font-size:24px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:8px 18px;white-space:nowrap;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);transition:left .6s cubic-bezier(.6,.05,.3,1),top .6s cubic-bezier(.6,.05,.3,1),opacity .3s,background .3s;opacity:0}
.tok.vis{opacity:1}
.tok.red{background:var(--orange)}.tok.green{background:var(--green)}.tok.blue{background:var(--blue)}.tok.teal{background:var(--teal)}.tok.violet{background:var(--violet)}
.group{position:absolute;border:4px dashed var(--teal);border-radius:28px;background:rgba(14,122,111,.04);z-index:1}
.group span{position:absolute;top:-20px;left:28px;background:var(--paper);padding:0 12px;font-family:var(--mono);font-size:24px;font-weight:700;color:var(--teal);letter-spacing:.1em;text-transform:uppercase}
.group.og{border-color:var(--orange);background:rgba(194,86,11,.04)}.group.og span{color:var(--orange)}
.badge{position:absolute;right:100px;top:118px;font-family:var(--mono);font-size:28px;font-weight:700;background:#fff;border:3px solid var(--line);border-radius:999px;padding:10px 24px;transition:all .3s}
.badge.bad{background:var(--orange-s);border-color:var(--orange);color:#7a3305}
.badge.good{background:var(--green-s);border-color:var(--green);color:#0d5426}
.lane{position:absolute;font-family:var(--mono);font-size:28px;font-weight:700}
.instant,.instant *{transition:none!important}

/* flip cards */
.fc{position:absolute;perspective:1600px;cursor:pointer}
.fc .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.fc.open .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.fc .f{background:var(--card);border:3px solid var(--line)}
.fc .f .ic{font-size:96px;line-height:1}
.fc .f .t{font-size:40px;font-weight:700;margin-top:18px;line-height:1.15}
.fc .f .h{position:absolute;bottom:22px;font-family:var(--mono);font-size:22px;color:var(--muted)}
.fc .b{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.fc .b .t{font-size:30px;font-weight:700;opacity:.85;line-height:1.2}
.fc .b .d{font-size:38px;font-weight:600;line-height:1.25;margin-top:16px}
.fc:hover .f{border-color:var(--ink)}

/* reveal tiles */
.tile{position:absolute;background:var(--card);border:3px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.tile .ic{font-size:64px}.tile .big{font-size:70px;font-weight:800;color:var(--teal);line-height:1}
.tile .t{font-size:32px;font-weight:700;margin-top:10px;line-height:1.2}
.banner{position:absolute;left:100px;right:100px;top:800px;text-align:center;font-size:40px;font-weight:700;color:#fff;background:var(--teal);border-radius:20px;padding:22px;transition:all .45s}

/* HUD */
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:50;opacity:.25;transition:opacity .3s}
#hud:hover{opacity:1}
#hud button{background:#22303d;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:14px var(--sans);cursor:pointer}
#hud button:hover{background:#34495c}
#hud .ct{color:#c9d4dc;font:13px var(--mono);margin-left:auto}
#bar{position:fixed;left:0;top:0;height:4px;background:var(--teal);z-index:60;transition:width .3s}
#toast{position:fixed;right:20px;bottom:60px;max-width:380px;background:#fff;color:var(--ink);border-radius:12px;padding:14px 16px;font:15px/1.4 var(--sans);box-shadow:0 12px 30px rgba(0,0,0,.4);display:none;z-index:70}

/* interactive widgets (inside stage) */
.int{cursor:auto}
.btn{font:600 24px var(--sans);border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 22px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.or{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.tl{background:var(--teal);color:#fff;border-color:var(--teal)}
.repo{position:absolute;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:24px;transition:all .3s}
.repo.flash{border-color:var(--teal);box-shadow:0 0 0 8px var(--teal-s)}
.repo.err{border-color:var(--orange);box-shadow:0 0 0 8px var(--orange-s);animation:shake .4s}
.repo h4{margin:0;font-size:32px}
.repo .chain{display:flex;flex-wrap:wrap;gap:10px;min-height:60px;margin:22px 0;align-items:center}
.chip{font:700 22px var(--mono);color:#fff;border-radius:10px;padding:8px 12px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.chip.c0{background:#6b7480}.chip.A{background:var(--violet)}.chip.B{background:var(--orange)}.chip.M{background:var(--teal)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.repo .acts{display:flex;gap:10px;flex-wrap:wrap}
.dead{font:700 26px var(--mono);color:var(--orange);min-height:60px;margin:22px 0;display:flex;align-items:center}
.glog{position:absolute;left:100px;right:100px;top:790px;height:130px;background:#101820;color:#d6efe7;border-radius:18px;font:24px/1.5 var(--mono);padding:14px 22px;overflow:hidden}
.glog .r{color:#ffb37a}.glog .g{color:#7be3a9}
.fly{position:absolute;z-index:20;transition:left .6s cubic-bezier(.6,.05,.3,1),top .6s cubic-bezier(.6,.05,.3,1)}
.file{position:absolute;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px;text-align:center;transition:all .35s}
.file .n{font:700 26px var(--mono)}.file .ts{font:700 52px var(--mono);margin-top:8px}
.file.new{border-color:var(--orange);box-shadow:0 0 0 8px var(--orange-s)}
.file.old{border-color:var(--green)}
.file.re{border-color:var(--teal);box-shadow:0 0 0 8px var(--teal-s);animation:pop .5s}
.file .ed{position:absolute;top:10px;right:10px;font-size:22px;padding:4px 10px}
.verdict{position:absolute;left:100px;right:100px;top:800px;font-size:36px;font-weight:700;text-align:center;border-radius:20px;padding:22px;background:var(--soft)}
.verdict.ok{background:var(--green-s);color:#0d5426}.verdict.re{background:var(--orange-s);color:#7a3305}
.pick button{font:700 28px var(--sans);width:70px;height:56px;border-radius:12px;border:3px solid var(--line);background:#fff;cursor:pointer;margin-left:6px}
.pick button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick button.right{background:var(--green);border-color:var(--green);color:#fff}
.pick button.wrong{background:var(--orange);border-color:var(--orange);color:#fff}
.mrow{display:flex;align-items:center;justify-content:space-between;font-size:30px;padding:12px 0;border-bottom:2px solid var(--soft)}
.qcard{position:absolute;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:26px}
.qcard h4{margin:0 0 16px;font-size:32px;line-height:1.2}
.qcard .o{display:block;width:100%;text-align:left;font:26px var(--sans);border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;margin-top:10px;cursor:pointer;color:var(--ink)}
.qcard .o.right{background:var(--green-s);border-color:var(--green)}.qcard .o.wrong{background:var(--orange-s);border-color:var(--orange)}
.qcard .o:disabled{cursor:default}

/* print */
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #hud,#bar,#toast{display:none!important}
  #viewport{position:static}
  #stage{position:static;transform:none!important;width:1920px;height:auto;box-shadow:none;overflow:visible;background:none}
  .slide{position:relative;opacity:1!important;transform:none!important;width:1920px;height:1080px;break-after:page;overflow:hidden;background:var(--paper)}
  .slide.dark{background:var(--ink)}
  .arr.live{animation:none;stroke-dasharray:none!important}
  .capbar .captext,.capbar .capnum,.capbar .sdots{display:none}
  .capall{display:block;columns:2;column-gap:60px;font-size:22px;line-height:1.35;margin:0;padding-left:34px;width:100%}
  .capall li{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="hud">
  <button id="bPrev">◀</button><button id="bNext">Next ▶</button>
  <button id="bFull">⛶ Fullscreen</button><button id="bPdf">⤓ PDF</button>
  <span class="ct" id="ct"></span>
</div>
<div id="toast"></div>

<script>

S.push({kind:'cover'});

/* ---------- 2 traditional (Fig 10.1) ---------- */

 arrows:[{a:'dev',b:'rel',s:2},{a:'rel',b:'cust',s:3},{a:'cust',b:'sup',s:5,c:'orange'},{a:'sup',b:'mnt',s:6,c:'orange'},{a:'mnt',b:'dev',s:6,c:'orange',via:[[335,725]]}],

         {l:'🐞 bug',c:'red',p:{4:'cust',5:'sup',6:'mnt',7:['dev','rel','cust']},lb:{7:'🔧 fix'},cl:{7:'green'},dy:{4:95,5:95,6:95,7:-95}}],
 st:{1:{dev:'on'},2:{dev:'',rel:'on'},3:{rel:'',cust:'ok'},4:{cust:'fail'},5:{sup:'warn'},6:{sup:'',mnt:'warn'},7:{mnt:'',cust:'ok'}},

/* ---------- 3 why devops ---------- */
S.push({kind:'flip', kick:'DevOps', title:'Why DevOps appeared', sub:'DevOps = Development + Operations. Three things led to it:',
 cards:[['⚡','Agile created a bottleneck','Development got faster. Releasing didn’t.'],
        ['📦','Amazon’s service teams','The same team builds and supports each service, and it’s more reliable.'],
        ['☁️','Software as a service','Runs on the cloud. No media, no downloads.']]});

/* ---------- 4 devops loop (Fig 10.2) ---------- */
S.push({kind:'diagram', kick:'DevOps · Fig 10.2', title:'DevOps: one team does it all',
 groups:[[130,280,1020,620,'One DevOps team']],
 nodes:{dev:[200,350,330,140,'Develop','','👩‍💻'], dep:[750,350,330,140,'Deploy','automated','🚀'], sup:[475,680,330,140,'Support','same people','🎧'],
        cloud:[1340,350,360,140,'Cloud service','','☁️'], users:[1340,680,360,140,'Customers','','👥']},
 arrows:[{a:'dev',b:'dep',s:2},{a:'dep',b:'cloud',s:3},{a:'cloud',b:'users',s:3},{a:'users',b:'sup',s:4,c:'orange'},{a:'sup',b:'dev',s:5,via:[[365,750]]}],

 st:{1:{dev:'on'},2:{dev:'',dep:'on'},3:{dep:'',users:'ok'},4:{users:'fail',sup:'warn'},5:{sup:'ok',users:'ok'}},
 badge:{1:['Handoffs between teams: 0','good']},
 caps:['One team writes a small change','Deployment is automated','It goes live as a cloud service','Problems come straight back to the team','The same team fixes it fast']});

/* ---------- 5 principles ---------- */
S.push({kind:'flip', kick:'Table 10.1', title:'DevOps principles',
 cards:[['👥','Everyone is responsible for everything','Develop, deliver and support together.'],
        ['🤖','Automate everything you can','Test, deploy, support with minimal manual work.'],
        ['📊','Measure first, change later','Collect data, then change process and tools.']]});

/* ---------- 6 benefits ---------- */
S.push({kind:'flip', kick:'Table 10.2', title:'Benefits of DevOps',
 cards:[['🚀','Faster deployment','Fewer communication delays.'],['🛡️','Reduced risk','Small releases mean fewer failures.'],
        ['🔧','Faster repair','No hunting for “whose problem”.'],['🙂','More productive teams','Happier people who stay.']]});

/* ---------- 7 code management ---------- */
S.push({kind:'tiles', kick:'Code management', title:'Why code management?', cols:3,
 tiles:[['10,000s','lines of code + tests'],['100s','of files'],['dozens','of libraries']],
 banner:'Code management keeps developers’ changes from interfering with each other'});

/* ---------- 8 Alice & Bob without ---------- */
const abNodes = (a,b,f)=>({alice:[170,330,330,140,a,'','👩‍💻'], co:[795,300,330,140,'FinanceMadeSimple','personal finance','🏢'],
  bob:[1420,330,330,140,b,'','🧑‍💻'], file:[760,640,400,150,f,'v1 · 🐞 intermittent bug','📄']});
S.push({kind:'diagram', kick:'Table 10.3', title:'Alice, Bob and the lost bug fix',

 tokens:[{l:'copy of v1',c:'blue',p:{2:['file','bob'],4:'file',5:null},cl:{4:'red'},lb:{4:'old copy'}},
         {l:'v1',c:'violet',p:{3:['file','alice','file'],4:null},lb:{3:'fix ✓'},cl:{3:'green'}}],
 st:{1:{file:'fail'},2:{bob:'on'},3:{bob:'',alice:'ok',file:'ok'},4:{file:'fail',alice:''},5:{co:'warn'},6:{co:'fail'}},
 subs:{3:{file:'v2 · ✓ fixed',alice:'fixed it ✓'},4:{file:'v3 · 🐞 bug is back',alice:'unaware ✗'},5:{co:'launched with the bug'},6:{co:'fined · customers leave'}},
 badge:{6:['Company fails','bad']},

/* ---------- 9 Alice & Bob with ---------- */
S.push({kind:'diagram', kick:'Table 10.3 · replayed', title:'Same story, with code management',

/* ---------- 10 Fig 10.3 ---------- */
S.push({kind:'diagram', kick:'Fig 10.3', title:'The repository is the heart of DevOps',
 nodes:{devs:[150,450,320,150,'Developers','','👩‍💻'], repo:[760,420,400,210,'Code management system','shared repository','🗄️'],
        auto:[1450,250,330,150,'DevOps automation','build · test · deploy','⚙️'], meas:[1450,650,330,150,'DevOps measurement','metrics','📊']},
 arrows:[{a:'devs',b:'repo',s:1,both:true},{a:'repo',b:'auto',s:2,both:true},{a:'repo',b:'meas',s:3,both:true}],

/* ---------- 11 fundamentals ---------- */
S.push({kind:'flip', kick:'Code management fundamentals', title:'Four things it supports',

  const log=el('div','glog');sec.appendChild(log);

    const c=box[k].querySelector('.chain');c.className='chain';c.innerHTML=S2[k].map(chip).join('');}}
  function fl(k,bad){const b=box[k];b.classList.remove('flash','err');void b.offsetWidth;b.classList.add(bad?'err':'flash');setTimeout(()=>b.classList.remove('flash','err'),800);}
  function fly(a,b,t){const A=box[a],B=box[b];const c=el('span','chip M fly',t);c.style.left=(A.offsetLeft+W/2-40)+'px';c.style.top='500px';sec.appendChild(c);

    if(g==='commit'){const k=w==='alice'?'A':'B';S2[w].push(k+(++n[k]));draw();fl(w);L('',`${nm(w)}: commit → saved locally`);}
    if(g==='push'){if(!S2.origin)return fl(w,1),L('r','✖ server is down: restore it first');

      else{fl(w,1);L('r',`✖ ${nm(w)}’s push rejected: pull and merge first`);}}
    if(g==='pull'){if(!S2.origin)return fl(w,1),L('r','✖ server is down');

  });

  ctr.addEventListener('input',e=>{if(e.target.dataset.ab!=null){ab=+e.target.value;ctr.querySelector('[data-abv]').textContent=ab+'%';}});
  ctr.addEventListener('pointerdown',e=>e.stopPropagation());
  const pick=()=>{if(mode==='ab'){const v2=Math.random()*100<ab;const pool=[0,1,2,3].filter(i=>ver[i]===(v2?2:1));return pool[Math.floor(Math.random()*pool.length)];}return Math.floor(Math.random()*4);};
  function tick(ts){requestAnimationFrame(tick);if(!active){lastT=ts;return;}const dt=Math.min(50,ts-(lastT||ts));lastT=ts;spawnT+=dt;
    if(spawnT>240){spawnT=0;const c=sv('circle',{r:12,cx:320,cy:560,fill:'#1F4FD1'});svg.appendChild(c);dots.push({c,x:320,y:560,st:'in'});}
    let q=0;const sp=.55*dt;
    dots.forEach(o=>{
      if(o.st==='in'){o.x+=sp;if(o.x>=700){if(phase!=='run')o.st='q';else{o.st='out';o.t=pick();o.x=920;o.c.setAttribute('fill',ver[o.t]===2?'#5B3FB0':'#1F4FD1');}}}
      else if(o.st==='q'){q++;o.x=690-((q-1)%8)*28;o.y=520-Math.floor((q-1)/8)*28;if(phase==='run'){o.st='out';o.t=pick();o.x=920;o.y=560;o.c.setAttribute('fill',ver[o.t]===2?'#5B3FB0':'#1F4FD1');}}
      else if(o.st==='out'){const s=SV[o.t];const dx=s.x-o.x,dy=s.y-o.y,L=Math.hypot(dx,dy);if(L<sp){o.st='p';o.life=0;o.x=s.x+40+Math.random()*200;}else{o.x+=dx/L*sp;o.y+=dy/L*sp;}}
      else if(o.st==='p'){o.life+=dt;o.c.setAttribute('opacity',Math.max(.1,1-o.life/700));if(o.life>700){o.st='x';if(mode==='ab')counts[ver[o.t]]++;}}
      o.c.setAttribute('cx',o.x);o.c.setAttribute('cy',o.y);});
    dots=dots.filter(o=>o.st==='x'?(o.c.remove(),false):true);
    if(phase==='drain'&&!dots.some(o=>o.st==='out'||o.st==='p')){ver=[2,2,2,2];phase='run';paint();ctrls();msg.textContent='3. Switch to v2 and resume. No request lost ✔';msg.style.color='#18803D';}
    if(mode==='ab')paint();}
  requestAnimationFrame(tick);setMode('switch');
  const cb=capbar(sec,{caps:[]},0);setCap(cb,0,0,'',d.hint);
  return {steps:0,apply(){},enter(){active=true;},leave(){active=false;},print(){dots.forEach(o=>o.c.remove());dots=[];}};
};

/* ---------- custom: scorecard ---------- */
CUSTOM.score=(sec,d)=>{
  const M=[['Process',[['Deployment frequency','up'],['Failed deployments %','down'],['Mean time to recovery','down'],['Lead time to deploy','down'],['Changed code shipped','up']]],
           ['Service',[['Availability','eq'],['Performance','eq'],['Customer complaints','down'],['New customers','up']]]];
  const sym={up:'▲',down:'▼',eq:'='};
  M.forEach(([g,rows],gi)=>{const c=el('div','int');Object.assign(c.style,{position:'absolute',left:(100+gi*890)+'px',top:'260px',width:'830px'});
    c.innerHTML=`<div style="font-family:var(--mono);font-size:26px;color:var(--teal);font-weight:700;letter-spacing:.1em;margin-bottom:6px">${g.toUpperCase()} METRICS</div>`+
      rows.map(([m,a])=>`<div class="mrow" data-a="${a}"><span>${m}</span><span class="pick">${['up','down','eq'].map(o=>`<button data-o="${o}">${sym[o]}</button>`).join('')}</span></div>`).join('');sec.appendChild(c);});
  const bar=el('div','int');Object.assign(bar.style,{position:'absolute',left:'100px',top:'840px',display:'flex',gap:'16px',alignItems:'center',fontSize:'32px',fontWeight:'700'});
  bar.innerHTML=`<button class="btn pri" data-chk>Check</button><button class="btn" data-show>Show answers</button><span data-res></span>`;sec.appendChild(bar);
  sec.addEventListener('click',e=>{const o=e.target.closest('[data-o]'),ck=e.target.closest('[data-chk]'),sh=e.target.closest('[data-show]');if(!o&&!ck&&!sh)return;e.stopPropagation();
    if(o){const r=o.closest('.mrow');r.querySelectorAll('button').forEach(b=>b.className='');o.classList.add('sel');}
    if(ck||sh){let ok=0,tot=0;sec.querySelectorAll('.mrow').forEach(r=>{tot++;const a=r.dataset.a,s=r.querySelector('.sel,.right,.wrong');r.querySelectorAll('button').forEach(b=>b.className='');
      const p=sh?a:(s&&s.dataset.o);if(p){if(p===a)ok++;r.querySelector(`[data-o=${p}]`).classList.add(p===a?'right':'wrong');if(p!==a)r.querySelector(`[data-o=${a}]`).classList.add('right');}});
      sec.querySelector('[data-res]').textContent=sh?'= means stable or improving':`${ok} / ${tot} correct`;}});
  const cb=capbar(sec,{caps:[]},0);setCap(cb,0,0,'',d.hint);
  return {steps:0,apply(){},print(){sec.querySelector('[data-show]').click();}};
};

/* ---------- custom: quiz ---------- */
CUSTOM.quiz=(sec,d)=>{
  const Q=[['What went wrong for Alice and Bob?',['Tests were slow','Bob’s save overwrote Alice’s fix','Git was down'],1],
           ['Why is a Git commit fast?',['It’s local, with no network','It skips history','It compresses files'],0],
           ['“Integrate twice” means…',['Run CI twice','Test locally, then push to CI','Merge twice'],1],
           ['Infrastructure as code gives you…',['Manual flexibility','Identical, reproducible environments','Faster laptops'],1]];
  Q.forEach(([q,o,a],k)=>{const c=el('div','qcard int',`<h4>${k+1}. ${q}</h4>`+o.map((x,j)=>`<button class="o" data-j="${j}">${x}</button>`).join(''));
    Object.assign(c.style,{left:(100+(k%2)*880)+'px',top:(260+Math.floor(k/2)*330)+'px',width:'840px'});c.dataset.a=a;sec.appendChild(c);});
  sec.addEventListener('click',e=>{const b=e.target.closest('.o');if(!b)return;e.stopPropagation();const c=b.closest('.qcard');if(c.dataset.done)return;c.dataset.done=1;
    const a=+c.dataset.a;c.querySelectorAll('.o').forEach((x,j)=>{x.disabled=true;if(j===a)x.classList.add('right');});if(+b.dataset.j!==a)b.classList.add('wrong');});
  const cb=capbar(sec,{caps:[]},0);setCap(cb,0,0,'',d.hint);
  return {steps:0,apply(){},print(){sec.querySelectorAll('.qcard').forEach(c=>{c.querySelectorAll('.o')[+c.dataset.a].classList.add('right');});}};
};

/* ---------- build all ---------- */
const SL=S.map((d,k)=>{const sec=el('section','slide');sec.id='s'+(k+1);stage.appendChild(sec);
  if(d.kind!=='cover')header(sec,d);
  const api=d.kind==='cover'?buildCover(sec):d.kind==='diagram'?buildDiagram(sec,d):d.kind==='flip'?buildFlip(sec,d):d.kind==='tiles'?buildTiles(sec,d):CUSTOM[d.fn](sec,d);
  return {sec,api,d};});

/* ---------- navigation ---------- */
let cur=0,step=0;
function show(k,s,anim){
  const prev=cur;cur=Math.max(0,Math.min(SL.length-1,k));step=s;
  SL.forEach((x,i)=>{x.sec.classList.toggle('cur',i===cur);x.sec.classList.toggle('past',i<cur);});
  if(prev!==cur){SL[prev].api.leave&&SL[prev].api.leave();}
  const A=SL[cur].api;A.enter&&A.enter();
  if(!anim){SL[cur].sec.classList.add('instant');A.apply(step,false);void SL[cur].sec.offsetWidth;SL[cur].sec.classList.remove('instant');}
  else A.apply(step,true);
  document.getElementById('ct').textContent=`slide ${cur+1} / ${SL.length}`+(A.steps?` · step ${step}/${A.steps}`:'');
  document.getElementById('bar').style.width=(100*(cur+ (A.steps?step/A.steps:1))/SL.length)+'%';
  try{history.replaceState(null,'','#slide-'+(cur+1));}catch(e){}
}
function next(){const A=SL[cur].api;if(step<A.steps)show(cur,step+1,true);else if(cur<SL.length-1)show(cur+1,0,false);}
function prev(){if(step>0)show(cur,step-1,false);else if(cur>0)show(cur-1,SL[cur-1].api.steps,false);}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(e.key)){e.preventDefault();next();}
  if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(e.key)){e.preventDefault();prev();}
  if(e.key==='Home')show(0,0,false);if(e.key==='End')show(SL.length-1,0,false);
  if(e.key==='f'||e.key==='F')full();});
stage.addEventListener('click',e=>{if(e.target.closest('.int,button,input'))return;next();});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?next():prev();}tx=null;});
document.getElementById('bNext').onclick=next;document.getElementById('bPrev').onclick=prev;
function full(){const d=document.documentElement;try{if(!document.fullscreenElement)d.requestFullscreen().catch(()=>toast('Fullscreen is blocked here. Use your browser’s fullscreen (F11).'));else document.exitFullscreen();}catch(e){toast('Fullscreen is blocked here.');}}
document.getElementById('bFull').onclick=full;
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',6000);}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- print ---------- */
window.preparePrint=function(){SL.forEach(x=>{x.sec.classList.add('instant');x.api.apply(x.api.steps,'print');x.api.print&&x.api.print();x.sec.querySelectorAll('.fc').forEach(f=>f.classList.add('open'));});};
document.getElementById('bPdf').onclick=()=>{preparePrint();const t0=Date.now();try{print();}catch(e){}if(Date.now()-t0<400)toast('This viewer blocks printing. Open the page in its own tab and press Ctrl/⌘+P → Save as PDF, or use the PDF file provided.');setTimeout(()=>location.reload(),600);};
addEventListener('beforeprint',()=>preparePrint());

const m=location.hash.match(/slide-(\d+)/);show(m?+m[1]-1:0,0,false);
</script>
